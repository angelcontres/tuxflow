# Quarkus HTTP Configuration
quarkus.http.port=8080
# Límite del cuerpo de la petición. Sin esto aplica el default de Quarkus (10 MB)
# y una foto de celular normal moría con HTTP 413 y cuerpo vacío. El frontend no
# podía distinguir eso de ningún otro fallo, así que el usuario veía "No pudimos
# subir la imagen" y reintentaba sin saber que el problema era el tamaño.
# 20 MB deja margen para fotos de teléfono.
# OJO: si cambias este valor, cambia también el texto de 413 en
# frontend/src/shared/utils/errorMessage.ts, que le cita el límite al usuario.
quarkus.http.limits.max-body-size=20M
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# Configuración de Conexión a Neo4j (Protocolo Bolt)
quarkus.neo4j.uri=${QUARKUS_NEO4J_URI:bolt://localhost:7687}
quarkus.neo4j.authentication.username=${QUARKUS_NEO4J_AUTHENTICATION_USERNAME:neo4j}
quarkus.neo4j.authentication.password=${QUARKUS_NEO4J_AUTHENTICATION_PASSWORD:password123}

# Configuración de MinIO / Amazon S3
quarkus.s3.endpoint-override=${S3_ENDPOINT:http://localhost:9000}
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}
quarkus.s3.path-style-access=true
redsocial.s3.bucket=${S3_BUCKET:redsocial-media}
# Endpoint que se devuelve al navegador en las URLs de multimedia. Debe ser
# alcanzable desde la maquina del usuario, no el hostname interno de Docker.
redsocial.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}

# Configuración de Notificaciones Web Push (VAPID)
redsocial.vapid.public-key=${VAPID_PUBLIC_KEY:}
redsocial.vapid.private-key=${VAPID_PRIVATE_KEY:}
redsocial.vapid.subject=${VAPID_SUBJECT:mailto:admin@redsocial.edu.ec}

# SmallRye OpenAPI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# JWT: firma y validación de tokens de sesión (RS256)
#
# Las claves incluidas son SOLO para desarrollo. La privada permite firmar
# cualquier token, así que tenerla en el repositorio es una fuga por diseño.
# En producción hay que sobreescribir ambas rutas con variables de entorno
# apuntando a claves gestionadas fuera del repo (vault, secrets de CI, etc).

# Clave con la que QUARKUS valida el header Authorization. Sin esto, la capa
# de seguridad de Quarkus rechaza cualquier petición con bearer token con un
# 401 de cuerpo vacío, antes de que el recurso REST reciba la llamada.
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:jwt-publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://redsocial.upse.edu.ec}

# Clave con la que se FIRMAN los tokens emitidos.
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:jwt-privateKey.pem}

# Consumidas por JwtTokenAdapter para validar el token en /api/auth/me.
redsocial.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:jwt-publicKey.pem}
redsocial.jwt.issuer=${JWT_ISSUER:https://redsocial.upse.edu.ec}
redsocial.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
