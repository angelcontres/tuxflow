server {
    listen 80;
    server_name localhost;

    # DNS interno de Docker. Sin esto, nginx resuelve "backend" una sola vez al
    # arrancar y guarda la IP en memoria: cuando el contenedor del backend se
    # recrea y toma otra IP, nginx sigue apuntando a la vieja y todo /api
    # responde 502 hasta que se reinicia nginx también. Con la variable en
    # proxy_pass, la resolución se hace en cada request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para API REST de Quarkus
    # Con variables en proxy_pass hay que pasar $request_uri: si no, nginx
    # reemplaza la URI completa por la de la directiva y manda solo "/api/".
    location /api/ {
        set $api_upstream backend:8080;
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy inverso para WebSockets de Chat
    location /chat/ {
        set $chat_upstream backend:8080;
        proxy_pass http://$chat_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
