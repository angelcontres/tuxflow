<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tuxflow.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TuxFlow - Red Social Distribuida</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registro del Service Worker para Notificaciones Web Push
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => console.log('ServiceWorker registrado con éxito:', reg.scope))
            .catch((err) => console.error('Error registrando ServiceWorker:', err));
        });
      }
    </script>
  </body>
</html>
