# ==============================================================================
# Red Social Distribuida - Despliegue Continuo (CD) en AWS (Self-Hosted Runner)
# ==============================================================================

name: CD - Despliegue en AWS

on:
  push:
    branches: [main, develop]
  # Permite ejecutar el despliegue manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: true

jobs:
  deploy:
    name: Despliegue en AWS EC2 (Docker Compose)
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Preparar servidor (Instalar Docker / Swap automáticamente si falta)
        run: |
          chmod +x setup-aws.sh
          ./setup-aws.sh

      - name: Configurar variables de entorno (.env)
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi
          # Aseguramos que FRONTEND_PORT esté definido
          if ! grep -q "FRONTEND_PORT=" .env; then
            echo "FRONTEND_PORT=3000" >> .env
          fi
          # Limpiamos cualquier endpoint con puerto :9000 para forzar ruta relativa limpia de Nginx
          sed -i 's|S3_PUBLIC_ENDPOINT=.*|S3_PUBLIC_ENDPOINT=|g' .env 2>/dev/null || true
          if ! grep -q "S3_PUBLIC_ENDPOINT=" .env; then
            echo "S3_PUBLIC_ENDPOINT=" >> .env
          fi
          cat .env

      - name: Desplegar contenedores con Docker Compose
        run: |
          echo "Deteniendo contenedores previos..."
          docker compose down --remove-orphans

          PROFILE_FLAG=""
          if grep -q "CLOUDFLARE_TUNNEL_TOKEN=" .env 2>/dev/null && [ -n "$(grep CLOUDFLARE_TUNNEL_TOKEN .env | cut -d= -f2-)" ]; then
            echo "Cloudflare Tunnel detectado. Activando perfil tunnel..."
            PROFILE_FLAG="--profile tunnel"
          fi

          echo "Construyendo y levantando servicios actualizados..."
          docker compose $PROFILE_FLAG up --build -d

      - name: Esperar disponibilidad de Neo4j
        run: |
          echo "Esperando que Neo4j esté listo..."
          RETRIES=35
          NEO4J_READY=false
          while [ $RETRIES -gt 0 ]; do
            if docker exec redsocial-neo4j cypher-shell -a bolt://localhost:7687 -u neo4j -p password123 "RETURN 1;" >/dev/null 2>&1; then
              NEO4J_READY=true
              break
            fi
            sleep 2
            RETRIES=$((RETRIES-1))
            echo "Esperando a Neo4j... (intentos restantes: $RETRIES)"
          done

          if [ "$NEO4J_READY" = false ]; then
            echo "Error: Neo4j no respondió a tiempo."
            exit 1
          fi
          echo "Neo4j está listo."

      - name: Cargar datos semilla (Solo si la base de datos está vacía)
        run: |
          chmod +x docker/seed.sh
          # Consultamos la cantidad de nodos de usuario existentes en Neo4j
          USER_COUNT=$(docker exec redsocial-neo4j cypher-shell -a bolt://localhost:7687 -u neo4j -p password123 --format plain "MATCH (u:Usuario) RETURN count(u);" 2>/dev/null | tail -n 1 | tr -d '[:space:]' || echo "0")
          echo "Usuarios encontrados en la base de datos: ${USER_COUNT:-0}"
          if [ "$USER_COUNT" = "0" ] || [ -z "$USER_COUNT" ]; then
            if [ -f "docker/neo4j-seed.cql" ]; then
              echo "Base de datos vacía detectada. Inyectando datos semilla iniciales..."
              docker/seed.sh --wipe docker/neo4j-seed.cql || true
            fi
          else
            echo "La base de datos ya contiene información ($USER_COUNT usuarios). Conservando datos de usuarios sin sobrescribir."
          fi

      - name: Verificar estado de los contenedores
        run: |
          echo "=== Contenedores en ejecución ==="
          docker compose ps
          echo "================================="
          echo "Despliegue finalizado con éxito en AWS."

      - name: Diagnóstico en caso de error
        if: failure()
        run: |
          echo "=== Estado detallado de contenedores ==="
          docker compose ps -a || true
          echo "=== Logs de Neo4j ==="
          docker logs redsocial-neo4j --tail 50 || true
          echo "=== Logs del Backend ==="
          docker logs redsocial-backend --tail 50 || true
